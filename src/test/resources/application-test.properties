# ===================================================================
# 【自动化单元/集成测试专用配置】application-test.properties
# ===================================================================
# 作用：专为本地执行 mvn test 或 GitHub Actions 执行 CI 测试时运行的临时内存环境。
# 激活条件：测试类标注有 @ActiveProfiles("test") 时自动加载。
# 核心原理：将真实 MySQL 数据库连接覆盖重写为 H2 纯内存数据库 (jdbc:h2:mem:testdb)，
#           并彻底禁用 Flyway 表迁移，从而实现极速单测运行且完全不产生物理脏数据、不污染数据库。
# 警告：请勿删除此文件，否则执行测试时会去尝试连接真实 MySQL 导致测试报错或测试数据污染。
# ===================================================================
# 测试环境配置
# ===================================================================
# Spring Boot 4 中旧的 autoconfigure.exclude 类名（如
# org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration）已不再生效，
# 会导致测试仍去连真实 MySQL。此处改为内存 H2 + 关闭 Flyway。
# 需要 Redis 的 @SpringBootTest 请继承 BaseIntegrationTest（Testcontainers Redis）。
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# H2 中 year 等为保留字，与 StatEntity.year 等列名冲突；改由在 JDBC URL 中配置 NON_KEYWORDS=YEAR 解决，避免将 TEXT 数据类型带上引号导致 DDL 执行报错。
# spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

# Redis：默认值；继承 BaseIntegrationTest 时由 @DynamicPropertySource 覆盖为 Testcontainers
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=1

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=-1ms

logging.level.com.listen.portfolio=INFO
logging.level.org.springframework.data.redis=WARN
