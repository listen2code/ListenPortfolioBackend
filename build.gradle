plugins {
    id 'java'
    id 'war'
    id 'idea'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'com.github.spotbugs' version '6.0.7'
}

group = 'com.listen'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // MyBatis-Plus & Spring Boot Starters
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.7'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Database & Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Metrics & Logging
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.1'

    // OpenAPI Docs
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Developer Tools & Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.7.3'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    providedCompile 'org.springframework.boot:spring-boot-starter-tomcat'

    // Testing Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation('it.ozimov:embedded-redis:0.7.3') {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
    }
    testImplementation 'org.testcontainers:junit-jupiter:1.19.0'
    testImplementation 'org.testcontainers:mysql:1.19.0'
    testImplementation 'org.testcontainers:testcontainers:1.19.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

bootWar {
    archiveFileName = 'portfolio-0.0.1-SNAPSHOT.war'
}

spotbugs {
    ignoreFailures = true
    showStackTraces = true
    showProgress = true
}

spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}

// ===================================================================
// 测试任务配置 (JUnit 5 + 排除规则 + 自动绑定覆盖率分析)
// ===================================================================
tasks.named('test') {
    // 启用现代 JUnit Platform (JUnit 5 Jupiter) 驱动执行
    useJUnitPlatform()
    
    // 持续集成环境与快速构建规则：
    // 在 CI 自动化构建流水线或指定 excludePerformanceTest 参数时，排除高耗时性能测试，防止流水线超时
    if (System.getenv('CI') == 'true' || project.hasProperty('excludePerformanceTest')) {
        exclude '**/performance/**'
    }
    
    // 核心钩子 (finalizedBy)：无论单测执行成功与否，一旦测试任务结束，自动拉起 JaCoCo 覆盖率报表生成
    finalizedBy jacocoTestReport
}

// ===================================================================
// JaCoCo 覆盖率报表生成任务配置 (jacocoTestReport)
// ===================================================================
// 机制原理：
//   1. dependsOn test：强制依赖测试任务，保证测试执行产出 .exec 字节码执行跟踪数据文件
//   2. reports 配置：
//      - xml.required = true：生成标准 XML 报告，便于 GitHub Actions、SonarQube 或 CI 平台解析
//      - html.required = true：生成全套可视化网页报告（位于 build/reports/jacoco/test/html/）
// ===================================================================
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

