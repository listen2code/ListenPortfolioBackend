# ===================================================================
# 【自动化单元/集成测试专用配置】application-test.properties
# ===================================================================
# 作用：专为本地执行 mvn test 或 GitHub Actions 执行 CI 测试时运行的临时内存环境。
# 激活条件：测试类标注有 @ActiveProfiles("test") 时自动加载。
# 核心原理：将真实 MySQL 数据库连接覆盖重写为 H2 纯内存数据库 (jdbc:h2:mem:testdb)，
#           并彻底禁用 Flyway 表迁移，从而实现极速单测运行且完全不产生物理脏数据、不污染数据库。
# 警告：请勿删除此文件，否则执行测试时会去尝试连接真实 MySQL 导致测试报错或测试数据污染。
# ===================================================================
# 测试环境配置
# ===================================================================
# Spring Boot 4 中旧的 autoconfigure.exclude 类名（如
# org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration）已不再生效，
# 会导致测试仍去连真实 MySQL。此处改为内存 H2 + 关闭 Flyway。
# 需要 Redis 的 @SpringBootTest 请继承 BaseIntegrationTest（Testcontainers Redis）。
# ===================================================================
# Swagger 调试配置
spring.application.name=portfolio-test

# 启用 SpringDoc 详细日志，便于调试 Swagger 问题
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG

# 使用内存 H2 数据库，测试后自动清理
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# H2 方言和自动建表
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# SpringDoc config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.packages-to-scan=com.listen.portfolio.api
