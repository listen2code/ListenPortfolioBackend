# ===================================================================
# 【自动化单元/集成测试专用配置】application-test.properties
# ===================================================================
# 作用：专为本地执行 ./gradlew test 或 GitHub Actions 执行 CI 测试时运行的临时内存环境。
# 激活条件：测试类标注有 @ActiveProfiles("test") 时自动加载。
# 核心原理：使用 H2 纯内存数据库，并通过 schema-h2.sql 自动创建表结构。
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 内存库自动初始化表结构
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.listen.portfolio.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

spring.flyway.enabled=false

# Redis：默认值；继承 BaseIntegrationTest 时由 @DynamicPropertySource 覆盖
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.database=1

spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=-1ms

logging.level.com.listen.portfolio=INFO
logging.level.org.springframework.data.redis=WARN
